<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erica Fan Homepage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #360a07; overflow: hidden; font-family: sans-serif; }
        #flash-container { width: 100%; height: 100%; }
        #flash-container ruffle-player { width: 100%; height: 100%; display: block; }

        /* Footer: auto-wrap and center */
        .footer {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: 12px;
            line-height: 1.5;
            padding: 0 16px;
            z-index: 50;
        }
        .footer a { color: #ff0000; text-decoration: none; }
        .footer a:hover { color: #fff; }
        .footer .sep { margin: 0 6px; opacity: 0.5; }

        /* Music player header (top) */
        #music-player {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(54, 10, 7, 0.92);
            border-bottom: 1px solid #851711;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            z-index: 100;
        }
        #music-player button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        #music-player button:hover { background: #851711; }
        #music-player button svg { display: block; }
        #music-player .track-title {
            min-width: 80px;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            flex-shrink: 1;
        }
        #music-player .volume {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        #music-player input[type="range"] {
            width: 60px;
            accent-color: #ff0000;
        }
        #music-player .play-btn {
            background: #ff0000;
        }
        #music-player .play-btn:hover { background: #cc0000; }

        /* SoundCloud background track (hidden but functional) */
        #sc-background {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
            border: 0;
        }
    </style>
</head>
<body>
    <div id="flash-container"></div>

    <!-- Footer: auto-wraps and centers -->
    <div class="footer">
        Fish in the Sky - an Erica Fan production<span class="sep">|</span>
        follow @ <a href="http://weibo.com/u/1745379962">Sina Weibo</a><span class="sep">|</span>
        Special thanks to <a href="http://weibo.com/138177171">3Feng</a> (Original website)<span class="sep">|</span>
        Powered by Cloudflare
    </div>

    <!-- Music player header (top) with SVG icons -->
    <div id="music-player">
        <button id="prev-btn" title="Previous" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="play-btn" class="play-btn" title="Play/Pause" aria-label="Play/Pause">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next-btn" title="Next" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <span class="track-title" id="track-title">Erica Fan</span>
        <div class="volume" id="volume-control">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
            <input type="range" id="volume-slider" min="0" max="100" value="80">
        </div>
    </div>

    <!-- SoundCloud background track (Fish In The Sky - Introduction) -->
    <iframe id="sc-background"
        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F96384039&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
        allow="autoplay">
    </iframe>

    <!-- Configure Ruffle BEFORE loading the script -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden"
        };
    </script>

    <!-- Local Ruffle files -->
    <script src="/ruffle.js"></script>

    <!-- MP3 playlist player (separate from background music) -->
    <script>
        (function () {
            var tracks = [
                { title: "唱什么歌", file: "/music/track01.mp3" },
                { title: "齐天大剩", file: "/music/track02.mp3" },
                { title: "爱情治疗师", file: "/music/track03.mp3" },
                { title: "蝴蝶森林", file: "/music/track04.mp3" },
                { title: "三人关系", file: "/music/track05.mp3" },
                { title: "酸民主义", file: "/music/track06.mp3" },
                { title: "小聪明", file: "/music/track07.mp3" },
                { title: "燕子", file: "/music/track08.mp3" },
                { title: "最爱的我", file: "/music/track09.mp3" },
                { title: "双生莲", file: "/music/track10.mp3" }
            ];

            var audio = new Audio();
            var current = 1;

            var playBtn = document.getElementById('play-btn');
            var prevBtn = document.getElementById('prev-btn');
            var nextBtn = document.getElementById('next-btn');
            var titleEl = document.getElementById('track-title');
            var volSlider = document.getElementById('volume-slider');

            var PLAY_ICON = '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
            var PAUSE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            audio.volume = 0.8;

            // iOS does not support programmatic volume (hardware-controlled only)
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                document.getElementById('volume-control').style.display = 'none';
            }

            function setPlayIcon(playing) {
                playBtn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
            }

            function loadTrack(index) {
                current = index;
                var track = tracks[current];
                audio.src = track.file;
                titleEl.textContent = (current + 1) + ". " + track.title;
            }

            function pauseBackground() {
                if (window.scWidget && window.scPlaying) {
                    window.scWidget.pause();
                    window.scPlaying = false;
                }
            }

            function toggleMp3() {
                if (audio.paused) {
                    pauseBackground(); // auto-mute background when player starts
                    audio.play().then(function () {
                        setPlayIcon(true);
                    }).catch(function () {
                        setPlayIcon(false);
                    });
                } else {
                    audio.pause();
                    setPlayIcon(false);
                }
            }

            playBtn.addEventListener('click', toggleMp3);

            prevBtn.addEventListener('click', function () {
                var wasPlaying = !audio.paused;
                current = (current - 1 + tracks.length) % tracks.length;
                loadTrack(current);
                if (wasPlaying) {
                    pauseBackground();
                    audio.play().then(function () { setPlayIcon(true); });
                } else {
                    setPlayIcon(false);
                }
            });

            nextBtn.addEventListener('click', function () {
                var wasPlaying = !audio.paused;
                current = (current + 1) % tracks.length;
                loadTrack(current);
                if (wasPlaying) {
                    pauseBackground();
                    audio.play().then(function () { setPlayIcon(true); });
                } else {
                    setPlayIcon(false);
                }
            });

            volSlider.addEventListener('input', function () {
                audio.volume = volSlider.value / 100;
            });

            audio.addEventListener('ended', function () {
                current = (current + 1) % tracks.length;
                loadTrack(current);
                audio.play();
            });

            loadTrack(current);
            setPlayIcon(false);
        })();
    </script>

    <!-- SoundCloud background music (plays on entry) -->
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        (function () {
            var iframe = document.getElementById('sc-background');
            var widget = SC.Widget(iframe);
            window.scWidget = widget;
            window.scPlaying = false;

            widget.bind(SC.Widget.Events.READY, function () {
                widget.play();
            });

            widget.bind(SC.Widget.Events.PLAY, function () {
                window.scPlaying = true;
            });

            widget.bind(SC.Widget.Events.PAUSE, function () {
                window.scPlaying = false;
            });

            // Fallback: play on first user interaction if autoplay was blocked
            function playOnInteraction() {
                if (!window.scPlaying) widget.play();
                document.removeEventListener('click', playOnInteraction);
                document.removeEventListener('keydown', playOnInteraction);
                document.removeEventListener('touchstart', playOnInteraction);
            }
            document.addEventListener('click', playOnInteraction);
            document.addEventListener('keydown', playOnInteraction);
            document.addEventListener('touchstart', playOnInteraction);
        })();
    </script>

    <!-- Initialize the Flash player -->
    <script>
        (function () {
            var ruffle = window.RufflePlayer.newest();
            var player = ruffle.createPlayer();
            document.getElementById('flash-container').appendChild(player);

            player.load({
                url: '/preview.swf',
                scale: 'showall',
                wmode: 'window',
                allowNetworking: 'all',
                allowScriptAccess: 'sameDomain',
                backgroundColor: '#360a07'
            });

            // Force a re-render after the Flash loads so the gramophone and
            // splash/footer-background layers show on all devices (Ruffle can
            // miss drawing some elements until the stage is resized).
            [1000, 2500, 4500].forEach(function (ms) {
                setTimeout(function () {
                    var c = document.getElementById('flash-container');
                    c.style.width = '99.9%';
                    setTimeout(function () { c.style.width = '100%'; }, 60);
                }, ms);
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish in the Sky - Erica - Restored</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #360a07; overflow: hidden; font-family: sans-serif; }
        #flash-container { width: 100%; height: 100%; }
        #flash-container ruffle-player { width: 100%; height: 100%; display: block; }
        .footer {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 12px; text-align: center;
        }
        .footer a { color: #ff0000; text-decoration: none; }
        .footer a:hover { color: #fff; }

        /* Music player */
        #music-player {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(54, 10, 7, 0.85);
            border: 1px solid #851711;
            border-radius: 24px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            z-index: 100;
        }
        #music-player button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        #music-player button:hover { background: #851711; }
        #music-player .track-title {
            min-width: 90px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        #music-player .volume {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #music-player input[type="range"] {
            width: 60px;
            accent-color: #ff0000;
        }
        #music-player .play-btn {
            background: #ff0000;
            font-size: 14px;
        }
        #music-player .play-btn:hover { background: #cc0000; }
    </style>
</head>
<body>
    <div id="flash-container"></div>

    <div class="footer">
        Fish in the Sky - Erica 
        <a href="http://weibo.com/u/1745379962">Sina Weibo</a>! 
        <br>
        Special thanks to <a href="http://weibo.com/138177171">3Feng</a>!
        <br>
        Powered by Cloudflare
    </div>

    <!-- Music player -->
    <div id="music-player">
        <button id="prev-btn" title="Previous">⏮</button>
        <button id="play-btn" class="play-btn" title="Play/Pause">▶</button>
        <button id="next-btn" title="Next">⏭</button>
        <span class="track-title" id="track-title">Music</span>
        <div class="volume">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="80">
        </div>
    </div>

    <!-- Configure Ruffle BEFORE loading the script -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden"
        };
    </script>

    <!-- Local Ruffle files -->
    <script src="/ruffle.js"></script>

    <!-- Initialize the player via the JS API -->
    <script>
        (function () {
            var ruffle = window.RufflePlayer.newest();
            var player = ruffle.createPlayer();
            document.getElementById('flash-container').appendChild(player);
            player.load({
                url: '/preview.swf',
                scale: 'showall',
                wmode: 'window',
                allowNetworking: 'all',
                allowScriptAccess: 'sameDomain',
                backgroundColor: '#360a07'
            });
        })();
    </script>

    <!-- Music playlist (original soundtrack) -->
    <script>
        (function () {
            var tracks = [
                { title: "唱什么歌", file: "/music/track01.mp3" },
                { title: "齐天大剩", file: "/music/track02.mp3" },
                { title: "爱情治疗师", file: "/music/track03.mp3" },
                { title: "蝴蝶森林", file: "/music/track04.mp3" },
                { title: "三人关系", file: "/music/track05.mp3" },
                { title: "酸民主义", file: "/music/track06.mp3" },
                { title: "小聪明", file: "/music/track07.mp3" },
                { title: "燕子", file: "/music/track08.mp3" },
                { title: "最爱的我", file: "/music/track09.mp3" },
                { title: "双生莲", file: "/music/track10.mp3" }
            ];

            var audio = new Audio();
            var current = 1; // config.xml had <firsttrack>2</firsttrack> (0-indexed = 1)

            var playBtn = document.getElementById('play-btn');
            var prevBtn = document.getElementById('prev-btn');
            var nextBtn = document.getElementById('next-btn');
            var titleEl = document.getElementById('track-title');
            var volSlider = document.getElementById('volume-slider');

            audio.volume = 0.8; // defaultvolume 80

            function loadTrack(index) {
                current = index;
                var track = tracks[current];
                audio.src = track.file;
                titleEl.textContent = (current + 1) + ". " + track.title;
            }

            function togglePlay() {
                if (audio.paused) {
                    audio.play().then(function () {
                        playBtn.textContent = '⏸';
                    }).catch(function () {
                        // Autoplay blocked - show play state
                        playBtn.textContent = '▶';
                    });
                } else {
                    audio.pause();
                    playBtn.textContent = '▶';
                }
            }

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', function () {
                current = (current - 1 + tracks.length) % tracks.length;
                loadTrack(current);
                if (!audio.paused) audio.play();
                playBtn.textContent = audio.paused ? '▶' : '⏸';
            });
            nextBtn.addEventListener('click', function () {
                current = (current + 1) % tracks.length;
                loadTrack(current);
                if (!audio.paused) audio.play();
                playBtn.textContent = audio.paused ? '▶' : '⏸';
            });
            volSlider.addEventListener('input', function () {
                audio.volume = volSlider.value / 100;
            });

            // Auto-advance to next track when one ends
            audio.addEventListener('ended', function () {
                current = (current + 1) % tracks.length;
                loadTrack(current);
                audio.play();
            });

            // Start on track 2 (as per original config)
            loadTrack(current);
        })();
    </script>
</body>
</html>

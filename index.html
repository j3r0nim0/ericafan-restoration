<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish in the Sky - Erica - Restored</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #360a07; overflow: hidden; font-family: sans-serif; }
        #flashContent { width: 100%; height: 100%; position: relative; }
        .footer {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 12px; text-align: center;
        }
        .footer a { color: #ff0000; text-decoration: none; }
        .footer a:hover { color: #fff; }
        #errorDisplay { display: none; color: #ff0000; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #loadingDisplay { color: #fff; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div id="flashContent"></div>
    <div id="errorDisplay">Flash player failed to load</div>
    <div id="loadingDisplay">Loading Flash player...</div>
    
    <div class="footer">
        Fish in the Sky - Erica 
        <a href="http://weibo.com/u/1745379962">Sina Weibo</a>! 
        <br>
        Special thanks to <a href="http://weibo.com/138177171">3Feng</a>!
        <br>
        Powered by Cloudflare
    </div>

    <!-- Use latest stable Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/web/ruffle.js"></script>
    
    <script>
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('flashContent');
            const errorDisplay = document.getElementById('errorDisplay');
            const loadingDisplay = document.getElementById('loadingDisplay');
            
            try {
                // Create Ruffle player with minimal config
                const ruffle = new RufflePlayer();
                
                // Set configuration
                ruffle.config = {
                    autoplay: 'on',
                    unmuteOverlay: 'hidden',
                    showSwfDownload: true,
                    scale: 'showall',
                    wmode: 'window',
                    allow: 'same-origin'
                };
                
                // Create player with absolute URL
                const player = ruffle.createPlayer({
                    swf: 'https://ericafan-restoration.pages.dev/preview.swf',
                    width: container.clientWidth,
                    height: container.clientHeight,
                    autocreate: true,
                    backgroundColor: '#360a07'
                });
                
                // Add player to container
                container.appendChild(player);
                
                // Hide loading
                loadingDisplay.style.display = 'none';
                
                // Add event listeners
                player.addEventListener('load', function() {
                    console.log('SWF loaded successfully');
                    loadingDisplay.style.display = 'none';
                    errorDisplay.style.display = 'none';
                });
                
                player.addEventListener('error', function(e) {
                    console.error('SWF load error:', e);
                    errorDisplay.style.display = 'block';
                    loadingDisplay.style.display = 'none';
                });
                
                // Start loading
                player.load();
                
            } catch (err) {
                console.error('Ruffle initialization error:', err);
                errorDisplay.textContent = 'Ruffle failed: ' + err.message;
                errorDisplay.style.display = 'block';
                loadingDisplay.style.display = 'none';
            }
        });
    </script>
</body>
</html>

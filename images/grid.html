<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ericafan Restoration — Image Grid (65)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
h1 { text-align: center; margin-bottom: 5px; color: #fff; font-size: 1.4rem; }
.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9rem; }
.controls { text-align: center; margin-bottom: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.controls button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: .2s; }
.controls button:hover { transform: translateY(-1px); }
.btn-keep { background: #2ecc71; color: #fff; }
.btn-delete { background: #e74c3c; color: #fff; }
.btn-clear { background: #555; color: #fff; }
.btn-list { background: #3498db; color: #fff; }
.btn-copy { background: #9b59b6; color: #fff; }
.keep-count { color: #2ecc71; font-weight: bold; }
.delete-count { color: #e74c3c; font-weight: bold; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; max-width: 1600px; margin: 0 auto; }
.card { position: relative; border-radius: 8px; overflow: hidden; cursor: pointer; border: 3px solid #333; transition: .2s; aspect-ratio: 2/3; background: #222; }
.card:hover { transform: scale(1.03); z-index: 1; }
.card.keep { border-color: #2ecc71; box-shadow: 0 0 15px rgba(46,204,113,.4); }
.card.delete { border-color: #e74c3c; box-shadow: 0 0 15px rgba(231,76,60,.4); opacity: .7; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.75); padding: 4px 8px; font-size: 0.75rem; display: flex; justify-content: space-between; }
.card .num { font-weight: bold; color: #fff; }
.card .fname { color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
.card .badge { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; color: #fff; display: none; }
.card.keep .badge.keep-badge { display: flex; background: #2ecc71; }
.card.delete .badge.delete-badge { display: flex; background: #e74c3c; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
.modal.show { display: flex; }
.modal-content { background: #2a2a3e; border-radius: 12px; padding: 20px; max-width: 700px; width: 100%; max-height: 80vh; overflow-y: auto; }
.modal-content h2 { margin-bottom: 12px; font-size: 1.1rem; }
.modal-content pre { background: #1a1a2e; padding: 12px; border-radius: 8px; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; max-height: 50vh; overflow-y: auto; }
.modal-close { margin-top: 12px; padding: 8px 24px; background: #555; color: #fff; border: none; border-radius: 6px; cursor: pointer; float: right; }
</style>
</head>
<body>

<h1>🖼️ Ericafan Restoration — Image Grid</h1>
<p class="subtitle"><span class="keep-count" id="keepCount">0</span> Keep · <span class="delete-count" id="deleteCount">0</span> Delete · <span id="totalCount">65</span> total — Click = Keep, Shift+Click = Delete</p>

<div class="controls">
  <button class="btn-keep" onclick="markAll('keep')">✓ Keep All</button>
  <button class="btn-delete" onclick="markAll('delete')">✗ Delete All</button>
  <button class="btn-clear" onclick="markAll('clear')">⟲ Clear All</button>
  <button class="btn-list" onclick="showList('keep')">📋 Show Keep List</button>
  <button class="btn-list" onclick="showList('delete')">🗑️ Show Delete List</button>
  <button class="btn-copy" onclick="copyList()">📄 Copy to Clipboard</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">List</h2>
    <pre id="modalBody"></pre>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const IMAGES = ["baidu_001.jpg","baidu_002.jpg","baidu_003.jpg","baidu_004.jpg","baidu_005.jpg","baidu_006.jpg","baidu_007.jpg","baidu_008.jpg","baidu_009.jpg","baidu_010.jpg","baidu_011.jpg","baidu_012.jpg","baidu_013.jpg","baidu_014.jpg","baidu_015.jpg","baidu_016.jpg","baidu_017.jpg","baidu_018.jpg","baidu_019.jpg","baidu_020.jpg","baidu_021.jpg","baidu_022.jpg","baidu_023.jpg","baidu_024.jpg","baidu_025.jpg","baidu_026.jpg","baidu_027.jpg","baidu_028.jpg","baidu_029.jpg","baidu_030.jpg","baidu_031.jpg","baidu_032.jpg","baidu_033.jpg","baidu_meituan.jpg","baidu_sina2.jpg","baidu_tencent_1.jpg","baidu_tencent_2.jpg","baidu_tencent_3.jpg","baidu_tencent_4.jpg","baidu_tencent_5.jpg","book-cover.jpg","fan-360-2.jpg","fan-360-portrait.jpg","fan-baike-portrait.jpg","fan-sina-2012.jpg","fan-xiaoyun-portrait.jpg","img001.jpg","img002.jpg","img003.jpg","img004.jpg","img005.jpg","img006.jpg","img007.jpg","img008.jpg","img011.jpg","img014.jpg","img016.jpg","img018.jpg","img032.jpg","img033.jpg","movie-poster.jpg","sina_1.jpg","sina_2.jpg","sina_3.jpg","sina_4.jpg"];

const state = {};

function initGrid() {
  const grid = document.getElementById('grid');
  IMAGES.forEach((fname, idx) => {
    const num = idx + 1;
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + num;
    card.innerHTML = '<img src="' + fname + '" alt="' + fname + '" loading="lazy">'
      + '<div class="label"><span class="num">#' + num + '</span><span class="fname">' + fname + '</span></div>'
      + '<div class="badge keep-badge">✓</div><div class="badge delete-badge">✗</div>';
    card.onclick = (e) => { e.shiftKey ? toggle('delete', num) : toggle('keep', num); };
    grid.appendChild(card);
    state[num] = 'none';
  });
  updateCounts();
}

function toggle(action, num) {
  const card = document.getElementById('card-' + num);
  if (action === 'keep') {
    if (state[num] === 'keep') { state[num] = 'none'; } else { state[num] = 'keep'; if (state[num+1] === 'delete') state[num+1] = 'none'; }
  } else {
    if (state[num] === 'delete') { state[num] = 'none'; } else { state[num] = 'delete'; }
  }
  card.className = 'card' + (state[num] === 'keep' ? ' keep' : '') + (state[num] === 'delete' ? ' delete' : '');
  updateCounts();
}

function markAll(action) {
  IMAGES.forEach((_, idx) => {
    const num = idx + 1;
    const card = document.getElementById('card-' + num);
    if (action === 'keep') { state[num] = 'keep'; card.className = 'card keep'; }
    else if (action === 'delete') { state[num] = 'delete'; card.className = 'card delete'; }
    else { state[num] = 'none'; card.className = 'card'; }
  });
  updateCounts();
}

function showList(action) {
  const items = IMAGES.filter((_, idx) => state[idx + 1] === action).map((f, idx) => {
    const num = IMAGES.indexOf(f) + 1;
    return '#' + num + ' — ' + f;
  });
  document.getElementById('modalTitle').textContent = action === 'keep' ? '📋 Keep List (' + items.length + ')' : '🗑️ Delete List (' + items.length + ')';
  document.getElementById('modalBody').textContent = items.length ? items.join('\n') : '(none)';
  document.getElementById('modal').classList.add('show');
}

function copyList() {
  const keep = IMAGES.filter((_, idx) => state[idx + 1] === 'keep').map((f, idx) => {
    const num = IMAGES.indexOf(f) + 1;
    return '#K' + num + ' — ' + f;
  }).join('\n');
  const del = IMAGES.filter((_, idx) => state[idx + 1] === 'delete').map((f, idx) => {
    const num = IMAGES.indexOf(f) + 1;
    return '#D' + num + ' — ' + f;
  }).join('\n');
  const text = 'KEEP (' + IMAGES.filter((_, idx) => state[idx + 1] === 'keep').length + '):\n' + keep + '\n\nDELETE (' + IMAGES.filter((_, idx) => state[idx + 1] === 'delete').length + '):\n' + del;
  navigator.clipboard.writeText(text).then(() => alert('Copied!'));
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function updateCounts() {
  const k = IMAGES.filter((_, idx) => state[idx + 1] === 'keep').length;
  const d = IMAGES.filter((_, idx) => state[idx + 1] === 'delete').length;
  document.getElementById('keepCount').textContent = k;
  document.getElementById('deleteCount').textContent = d;
}

initGrid();
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>

</body>
</html>

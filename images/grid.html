<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ericafan Restoration — Remaining Images</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a1a;
    color: #eee;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 24px;
  }
  .stats {
    text-align: center;
    color: #999;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid #444;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
    position: relative;
  }
  .card:hover {
    border-color: #4a9eff;
    box-shadow: 0 0 12px rgba(74, 158, 255, 0.3);
  }
  .card.selected {
    border-color: #4caf50;
    box-shadow: 0 0 12px rgba(76, 175, 80, 0.4);
  }
  .card.deleted {
    border-color: #f44336;
    box-shadow: 0 0 12px rgba(244, 67, 54, 0.4);
    opacity: 0.6;
  }
  .card .num {
    position: absolute;
    top: 4px;
    left: 4px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 4px;
    z-index: 2;
  }
  .card .badge {
    position: absolute;
    top: 4px;
    right: 4px;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 4px;
    z-index: 2;
  }
  .badge.keep { background: #4caf50; color: #fff; }
  .badge.delete { background: #f44336; color: #fff; }
  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }
  .card .filename {
    padding: 6px 8px;
    font-size: 11px;
    color: #888;
    text-align: center;
    border-top: 1px solid #333;
  }
  .actions {
    text-align: center;
    margin: 20px 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .actions button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .actions button:hover { background: #444; }
  .actions .keep-btn { border-color: #4caf50; color: #4caf50; }
  .actions .keep-btn:hover { background: #4caf50; color: #fff; }
  .actions .delete-btn { border-color: #f44336; color: #f44336; }
  .actions .delete-btn:hover { background: #f44336; color: #fff; }
  .actions .clear-btn { border-color: #ff9800; color: #ff9800; }
  .actions .clear-btn:hover { background: #ff9800; color: #fff; }
  #output {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 60px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 12px 0;
    font-size: 13px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 3px;
  }
  .legend-swatch.green { background: #4caf50; }
  .legend-swatch.red { background: #f44336; }
  .legend-swatch.gray { background: #444; }
</style>
</head>
<body>
<h1>🖼️ Ericafan Restoration — Remaining Images</h1>
<p class="stats">15 images · Click to mark Keep (green) · Shift+Click to mark Delete (red) · Click again to unmark</p>

<div class="legend">
  <span class="legend-item"><span class="legend-swatch gray"></span> Unmarked</span>
  <span class="legend-item"><span class="legend-swatch green"></span> Keep</span>
  <span class="legend-item"><span class="legend-swatch red"></span> Delete</span>
</div>

<div class="actions">
  <button class="keep-btn" onclick="markAll('keep')">✓ Keep All</button>
  <button class="delete-btn" onclick="markAll('delete')">✗ Delete All</button>
  <button class="clear-btn" onclick="markAll('clear')">⟲ Clear All</button>
  <button onclick="showKeep()">📋 Show Keep List</button>
  <button onclick="showDelete()">🗑️ Show Delete List</button>
  <button onclick="copyOutput()">📄 Copy to Clipboard</button>
</div>

<div class="grid" id="grid"></div>

<div class="actions">
  <button class="keep-btn" onclick="markAll('keep')">✓ Keep All</button>
  <button class="delete-btn" onclick="markAll('delete')">✗ Delete All</button>
  <button class="clear-btn" onclick="markAll('clear')">⟲ Clear All</button>
  <button onclick="showKeep()">📋 Show Keep List</button>
  <button onclick="showDelete()">🗑️ Show Delete List</button>
  <button onclick="copyOutput()">📄 Copy to Clipboard</button>
</div>

<div id="output">15 images remaining. Click to mark them, then use buttons above.</div>

<script>
const IMAGES = [
  "img001.jpg",
  "img002.jpg",
  "img003.jpg",
  "img004.jpg",
  "img005.jpg",
  "img006.jpg",
  "img007.jpg",
  "img008.jpg",
  "img011.jpg",
  "img014.jpg",
  "img016.jpg",
  "img018.jpg",
  "img032.jpg",
  "img033.jpg",
  "img045.jpg"
];

const state = {};

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  IMAGES.forEach((f, i) => {
    const idx = i + 1;
    const card = document.createElement('div');
    card.className = 'card';
    if (state[f] === 'keep') card.classList.add('selected');
    if (state[f] === 'delete') card.classList.add('deleted');

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = idx;
    card.appendChild(num);

    if (state[f]) {
      const badge = document.createElement('div');
      badge.className = 'badge ' + state[f];
      badge.textContent = state[f] === 'keep' ? '✓ KEEP' : '✗ DEL';
      card.appendChild(badge);
    }

    const img = document.createElement('img');
    img.src = f;
    img.loading = 'lazy';
    img.alt = f;
    card.appendChild(img);

    const fn = document.createElement('div');
    fn.className = 'filename';
    fn.textContent = f;
    card.appendChild(fn);

    card.addEventListener('click', (e) => {
      if (e.shiftKey) {
        state[f] = (state[f] === 'delete') ? undefined : 'delete';
      } else {
        state[f] = (state[f] === 'keep') ? undefined : 'keep';
      }
      render();
    });

    grid.appendChild(card);
  });
}

function markAll(action) {
  IMAGES.forEach(f => {
    if (action === 'keep') state[f] = 'keep';
    else if (action === 'delete') state[f] = 'delete';
    else delete state[f];
  });
  render();
  document.getElementById('output').textContent = action === 'clear' ? 'All marks cleared.' : `All ${IMAGES.length} images marked as "${action}".`;
}

function showKeep() {
  const kept = IMAGES.filter(f => state[f] === 'keep');
  if (kept.length === 0) {
    document.getElementById('output').textContent = 'No images marked as Keep.';
    return;
  }
  const nums = kept.map(f => IMAGES.indexOf(f) + 1).join(', ');
  const files = kept.join('\n');
  document.getElementById('output').textContent =
    `KEEP — ${kept.length} images\nNumbers: ${nums}\n\n${files}`;
}

function showDelete() {
  const del = IMAGES.filter(f => state[f] === 'delete');
  if (del.length === 0) {
    document.getElementById('output').textContent = 'No images marked for Delete.';
    return;
  }
  const nums = del.map(f => IMAGES.indexOf(f) + 1).join(', ');
  const files = del.join('\n');
  document.getElementById('output').textContent =
    `DELETE — ${del.length} images\nNumbers: ${nums}\n\n${files}`;
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('button[onclick="copyOutput()"]');
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

render();
</script>
</body>
</html>
